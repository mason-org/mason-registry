---
name: fourmolu
description: A fork of Ormolu that uses four space indentation and allows arbitrary configuration.
homepage: https://hackage.haskell.org/package/fourmolu
licenses:
  - BSD-3-Clause
languages:
  - Haskell
categories:
  - Formatter

source:
  # renovate:versioning=loose
  id: pkg:github/fourmolu/fourmolu@v0.21.0.0
  asset:
    - target: darwin_x64
      file: fourmolu-{{ version | strip_prefix "v" }}-darwin-x86_64.zip
      bin: fourmolu-{{ version | strip_prefix "v" }}-darwin-x86_64/fourmolu
    - target: darwin_arm64
      file: fourmolu-{{ version | strip_prefix "v" }}-darwin-arm64.zip
      bin: fourmolu-{{ version | strip_prefix "v" }}-darwin-arm64/fourmolu
    - target: linux_x64_gnu
      file: fourmolu-{{ version | strip_prefix "v" }}-linux-x86_64.zip
      bin: fourmolu-{{ version | strip_prefix "v" }}-linux-x86_64/fourmolu
    - target: linux_arm64
      file: fourmolu-{{ version | strip_prefix "v" }}-linux-arm64.zip
      bin: fourmolu-{{ version | strip_prefix "v" }}-linux-arm64/fourmolu

bin:
  fourmolu: "{{source.asset.bin}}"
