---
name: kcl
description: |
  KCL is an open-source, constraint-based record and functional language that enhances the writing of complex
  configurations, including those for cloud-native scenarios.
homepage: https://kcl-lang.io
licenses:
  - Apache-2.0
languages:
  - KCL
categories:
  - Compiler
  - Formatter
  - LSP
  - Linter

source:
  # Update after both upstream repositories publish matching releases.
  id: pkg:generic/kcl-lang/kcl@v0.13.3
  download:
    - target: darwin_x64
      files:
        kcl.tar.gz: https://github.com/kcl-lang/cli/releases/download/{{version}}/kcl-{{version}}-darwin-amd64.tar.gz
        kcl-language-server.tar.gz: https://github.com/kcl-lang/kcl/releases/download/{{version}}/kcl-language-server-{{version}}-darwin-amd64.tar.gz
      bin: kcl-language-server
      cli: kcl

    - target: darwin_arm64
      files:
        kcl.tar.gz: https://github.com/kcl-lang/cli/releases/download/{{version}}/kcl-{{version}}-darwin-arm64.tar.gz
        kcl-language-server.tar.gz: https://github.com/kcl-lang/kcl/releases/download/{{version}}/kcl-language-server-{{version}}-darwin-arm64.tar.gz
      bin: kcl-language-server
      cli: kcl

    - target: linux_x64_gnu
      files:
        kcl.tar.gz: https://github.com/kcl-lang/cli/releases/download/{{version}}/kcl-{{version}}-linux-amd64.tar.gz
        kcl-language-server.tar.gz: https://github.com/kcl-lang/kcl/releases/download/{{version}}/kcl-language-server-{{version}}-linux-amd64.tar.gz
      bin: kcl-language-server
      cli: kcl

    - target: win_x64
      files:
        kcl.zip: https://github.com/kcl-lang/cli/releases/download/{{version}}/kcl-{{version}}-windows-amd64.zip
        kcl-language-server.zip: https://github.com/kcl-lang/kcl/releases/download/{{version}}/kcl-language-server-{{version}}-windows-amd64.zip
      bin: kcl-language-server.exe
      cli: kcl.exe

bin:
  kcl: "{{source.download.cli}}"
  kcl-language-server: "{{source.download.bin}}"

neovim:
  lspconfig: kcl
