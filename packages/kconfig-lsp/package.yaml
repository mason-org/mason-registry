---
name: kconfig-lsp
description: |
  A language server for the Kconfig configuration language used in Linux, Zephyr, U-Boot, coreboot, and other
  projects.
homepage: https://github.com/cccheng/kconfig-lsp
licenses:
  - MIT
languages:
  - Kconfig
categories:
  - LSP

source:
  id: pkg:github/cccheng/kconfig-lsp@v0.4.0
  asset:
    - target: darwin_arm64
      file: kconfig-lsp-aarch64-apple-darwin.tar.gz
      bin: kconfig-lsp
    - target: darwin_x64
      file: kconfig-lsp-x86_64-apple-darwin.tar.gz
      bin: kconfig-lsp
    - target: linux_arm64_gnu
      file: kconfig-lsp-aarch64-unknown-linux-gnu.tar.gz
      bin: kconfig-lsp
    - target: linux_x64_gnu
      file: kconfig-lsp-x86_64-unknown-linux-gnu.tar.gz
      bin: kconfig-lsp
    - target: win_x64
      file: kconfig-lsp-x86_64-pc-windows-msvc.zip
      bin: kconfig-lsp.exe

bin:
  kconfig-lsp: "{{source.asset.bin}}"

neovim:
  lspconfig: kconfig_lsp
