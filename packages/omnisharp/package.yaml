---
name: omnisharp
description: |
  OmniSharp language server based on Roslyn workspaces. This version of OmniSharp requires the .NET 10 runtime to be
  installed.
homepage: https://github.com/OmniSharp/omnisharp-roslyn
licenses:
  - MIT
languages:
  - C#
categories:
  - LSP

source:
  id: pkg:github/OmniSharp/omnisharp-roslyn@v2.0.0
  asset:
    - target: darwin_x64
      file: omnisharp-osx-x64.zip:libexec/
    - target: darwin_arm64
      file: omnisharp-osx-arm64.zip:libexec/
    - target: linux_x64
      file: omnisharp-linux-x64.zip:libexec/
    - target: linux_arm64
      file: omnisharp-linux-arm64.zip:libexec/
    - target: win_x64
      file: omnisharp-win-x64.zip:libexec/
    - target: win_arm64
      file: omnisharp-win-arm64.zip:libexec/

schemas:
  lsp: vscode:https://raw.githubusercontent.com/OmniSharp/omnisharp-vscode/master/package.json

bin:
  OmniSharp: dotnet:libexec/OmniSharp.dll

neovim:
  lspconfig: omnisharp
